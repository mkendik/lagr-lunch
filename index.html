<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lágr Lunch</title>
<meta name="description" content="Kdo obědvá na offsite. Potvrď každý den, ať kuchař ví, pro kolik lidí vařit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C0B09'/%3E%3Crect x='7' y='7' width='18' height='18' rx='5' fill='%23F3941F'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0C0B09; --surface:#161410; --surface-lift:#1D1A14; --line:#272420;
  --accent:#F3941F; --accent-soft:rgba(243,148,31,.13); --accent-line:rgba(243,148,31,.42);
  --text:#F1EEE8; --muted:#8A8377; --faint:#5C574E; --bad:#E0623E;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ink); color:var(--text);
  font-family:Poppins,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
#root{max-width:460px; margin:0 auto; padding:22px 18px 40px; display:flex; flex-direction:column; gap:22px}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

.top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
.brand h1{margin:0; font-family:Montserrat,sans-serif; font-weight:700; font-size:23px; letter-spacing:-.01em}
.brand p{margin:3px 0 0; color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}
.who{text-align:right; flex:0 0 auto}
.who .name{font-family:Montserrat,sans-serif; font-weight:600; font-size:13px}
.who button{display:block; margin-left:auto; color:var(--faint); font-size:11.5px; text-decoration:underline; padding:2px 0}
.who button:hover{color:var(--muted)}

.banner{border-radius:var(--r); padding:10px 13px; font-size:12.5px;
  background:rgba(224,98,62,.12); border:1px solid rgba(224,98,62,.4); color:var(--bad)}
.banner[hidden]{display:none}

.strip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 6px; text-align:center}
.tile b{display:block; font-family:Montserrat,sans-serif; font-weight:700; font-size:21px;
  font-variant-numeric:tabular-nums; color:var(--accent); line-height:1.15}
.tile b.zero{color:var(--faint)}
.tile span{display:block; margin-top:2px; color:var(--muted); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase}

.days{display:flex; flex-direction:column; gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 15px 13px; display:flex; flex-direction:column; gap:11px}
.card.in{background:var(--surface-lift); border-color:var(--accent-line)}
.card.eatout{border-style:dashed}
.head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.head h2{margin:0; font-family:Montserrat,sans-serif; font-weight:700; font-size:19px; letter-spacing:-.01em}
.head time{color:var(--faint); font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.soup{margin:0 0 5px; font-size:12.5px; color:var(--muted)}
.soup span{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin-right:7px}
.soup i{font-style:normal; color:var(--faint)}
.dish{margin:0; font-weight:500; font-size:14.5px}
.dish em{font-style:normal; color:var(--accent)}
.dish a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-line)}
.dish a:hover{border-bottom-color:var(--accent)}
.dish a span{font-size:.85em; margin-left:4px; opacity:.8}
.note{margin:2px 0 0; color:var(--muted); font-size:12.5px}
.count{font-family:Montserrat,sans-serif; font-weight:600; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.count b{color:var(--accent); font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:11.5px; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.04);
  border:1px solid var(--line); color:var(--muted)}
.chip.yes{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
.chip.no{text-decoration:line-through; color:var(--faint)}
.chip.idk{border-style:dashed; color:var(--faint); background:none}
.vote{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.vote button{height:48px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03);
  font-family:Montserrat,sans-serif; font-weight:600; font-size:14px; color:var(--muted);
  transition:background .12s, border-color .12s, color .12s}
.vote button:hover:not(:disabled){border-color:var(--faint); color:var(--text)}
.vote button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#191307}
.vote button.outbtn[aria-pressed="true"]{background:rgba(255,255,255,.13); border-color:var(--faint); color:var(--text)}

footer{border-top:1px solid var(--line); padding-top:15px; display:flex; flex-direction:column; gap:4px}
footer p{margin:0; color:var(--muted); font-size:12.5px}
footer .cook{color:var(--faint); font-size:11.5px}
.saving{color:var(--faint); font-size:11px; min-height:14px; letter-spacing:.04em}

.gate{position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
  justify-content:center; padding:24px; z-index:10; overflow-y:auto}
.gate .box{width:100%; max-width:340px; text-align:center}
.gate .mark{width:34px; height:34px; margin:0 auto 10px; border-radius:9px; background:var(--accent)}
.gate h1{margin:0; font-family:Montserrat,sans-serif; font-weight:700; font-size:25px}
.gate p{margin:6px 0 18px; color:var(--muted); font-size:13px}
.gate .names{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gate .names button{height:48px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); font-family:Montserrat,sans-serif; font-weight:600; font-size:14px}
.gate .names button:hover{border-color:var(--accent-line); color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  "use strict";

  var API="https://ylkvnywhkrckbgpmulcs.supabase.co/rest/v1/lunch_votes";
  var KEY="sb_publishable_dsSYoO2hqhaPOa9gFzv7yw_avn_L3FO";

  var PEOPLE=["Martin","Viktor","David","Dominik","Jindra","Michal","Petr","Adam","Matěj","Pavel"];

  var DAYS=[
    {date:"2026-08-24",label:"Pondělí",short:"Po",soup:"Gulášová",
      dish:"Zapečené kuřecí maso, rýže",note:"Varianta s broskví a sýrem podle nálady"},
    {date:"2026-08-25",label:"Úterý",short:"Út",soup:"Hrášková",soupMaybe:true,
      dish:"Boloňské těstoviny, sýr",note:"Penne"},
    {date:"2026-08-26",label:"Středa",short:"St",soup:"Rajská",
      dish:"Quesadillas s trhaným vepřovým, sýr, salát a rajčata",
      note:"Salsa, zakysaná smetana, pico de gallo"},
    {date:"2026-08-27",label:"Čtvrtek",short:"Čt",dish:"Restaurace",
      url:"https://www.penzioncenkovice.cz/restaurace",
      note:"Jde se jíst ven, nevaří se",eatout:true}
  ];
  var COOK="Martin Kendík";
  var LOCK="Nákup je v sobotu. Potvrď to prosím do té doby.";
  var NAME_KEY="lagrLunchName", VOTE_KEY="lagrLunchVotes";

  var root=document.getElementById("root");
  var votes={};            // slug -> {name, days}
  var me=null, offline=false, saving="", timer=null, poll=null;

  try{ me=localStorage.getItem(NAME_KEY)||null; }catch(e){}
  if(me && PEOPLE.indexOf(me)<0) me=null;   // roster changed under an old device

  function slug(n){
    return n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function myDays(){
    var k=slug(me);
    if(!votes[k]) votes[k]={name:me,days:{}};
    return votes[k].days;
  }
  function tally(date){
    var inn=[], out=[], idk=[];
    PEOPLE.forEach(function(n){
      var v=(votes[slug(n)]||{}).days||{};
      if(v[date]===true) inn.push(n);
      else if(v[date]===false) out.push(n);
      else idk.push(n);
    });
    return {inn:inn,out:out,idk:idk};
  }

  function headers(extra){
    var h={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
    if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
    return h;
  }

  // skipMerge guards the save()->load()->mergeLocal()->save() cycle: the load
  // that follows a successful write must never queue another write.
  function load(skipMerge){
    return fetch(API+"?select=person_id,name,days",{headers:headers(),cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(rows){
        var next={};
        rows.forEach(function(r){
          if(PEOPLE.map(slug).indexOf(r.person_id)<0) return;
          next[r.person_id]={name:r.name,days:r.days||{}};
        });
        votes=next;
        if(me && !skipMerge) mergeLocal();
        offline=false; render();
      })
      .catch(function(){ offline=true; render(); });
  }

  // A vote made while the connection was down lives on the device; put it back.
  function mergeLocal(){
    var local=null;
    try{ local=JSON.parse(localStorage.getItem(VOTE_KEY)||"null"); }catch(e){}
    if(!local||typeof local!=="object") return;
    var d=myDays(), changed=false;
    Object.keys(local).forEach(function(k){
      if(d[k]!==local[k]){ d[k]=local[k]; changed=true; }
    });
    if(changed) save();
  }

  function vote(date,val){
    var d=myDays();
    if(d[date]===val) delete d[date]; else d[date]=val;
    try{ localStorage.setItem(VOTE_KEY,JSON.stringify(d)); }catch(e){}
    saving="Ukládám…"; render();
    clearTimeout(timer); timer=setTimeout(save,600);
  }

  function save(){
    var k=slug(me), body={person_id:k,name:me,days:myDays(),updated_at:new Date().toISOString()};
    return fetch(API,{method:"POST",
        headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),
        body:JSON.stringify(body)})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        offline=false; saving="Uloženo"; paintSaving();
        return load(true);
      })
      .catch(function(){
        offline=true; saving=""; render();
      });
  }

  function render(){
    if(!me){ renderGate(); return; }
    var h="";
    h+='<div class="top"><div class="brand"><h1>Lágr Lunch</h1>'
      + '<p>Po 24. &ndash; Čt 27. srpna</p></div>'
      + '<div class="who"><div class="name">'+esc(me)+'</div>'
      + '<button type="button" data-act="forget">nejsi to ty?</button></div></div>';

    h+='<div class="banner"'+(offline?"":" hidden")+'>Nejsi online, poslední změna se neuložila. '
      + 'Máš ji v telefonu, pošle se sama, až bude signál.</div>';

    h+='<div class="strip">';
    DAYS.forEach(function(d){
      var n=tally(d.date).inn.length;
      h+='<div class="tile"><b'+(n?'':' class="zero"')+'>'+n+'</b><span>'+esc(d.short)+'</span></div>';
    });
    h+='</div>';

    h+='<div class="days">';
    DAYS.forEach(function(d){
      var t=tally(d.date), v=(votes[slug(me)]||{}).days||{}, mine=v[d.date];
      h+='<article class="card'+(mine===true?" in":"")+(d.eatout?" eatout":"")+'">'
        + '<div class="head"><h2>'+esc(d.label)+'</h2><time>'+esc(d.date)+'</time></div>'
        + '<div>'
        + (d.soup?'<p class="soup"><span>Polévka</span>'+esc(d.soup)
            +(d.soupMaybe?' <i>ještě nejisté</i>':'')+'</p>':'')
        + '<p class="dish">'+(d.eatout
            ? (d.url
                ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">'
                  +esc(d.dish)+'<span aria-hidden="true">&#8599;</span></a>'
                : '<em>'+esc(d.dish)+'</em>')
            : esc(d.dish))+'</p>'
        + '<p class="note">'+esc(d.note)+'</p></div>'
        + '<div class="count"><b>'+t.inn.length+' z '+PEOPLE.length+' jí</b>'
        + ' &middot; '+t.out.length+' nejí &middot; '+t.idk.length+' bez odpovědi</div>'
        + '<div class="chips">';
      t.inn.forEach(function(n){ h+='<span class="chip yes">'+esc(n)+'</span>'; });
      t.out.forEach(function(n){ h+='<span class="chip no">'+esc(n)+'</span>'; });
      t.idk.forEach(function(n){ h+='<span class="chip idk">'+esc(n)+'</span>'; });
      h+='</div><div class="vote">'
        + '<button type="button" data-act="vote" data-date="'+d.date+'" data-val="1"'
        +   ' aria-pressed="'+(mine===true)+'">Jím</button>'
        + '<button type="button" class="outbtn" data-act="vote" data-date="'+d.date+'" data-val="0"'
        +   ' aria-pressed="'+(mine===false)+'">Nejím</button>'
        + '</div></article>';
    });
    h+='</div>';

    h+='<footer><div class="saving">'+esc(saving)+'</div><p>'+esc(LOCK)+'</p>'
      + '<p class="cook">Vaří: '+esc(COOK)+'. Dalším klikem na stejné tlačítko odpověď zrušíš.</p></footer>';
    root.innerHTML=h;
  }

  function renderGate(){
    var h='<div class="gate"><div class="box"><div class="mark"></div><h1>Lágr Lunch</h1>'
      + '<p>Kdo jsi? Ať kuchař ví, pro kolik lidí vařit.</p><div class="names">';
    PEOPLE.forEach(function(n){
      h+='<button type="button" data-act="who" data-name="'+esc(n)+'">'+esc(n)+'</button>';
    });
    h+='</div></div></div>';
    root.innerHTML=h;
  }
  function paintSaving(){ var el=root.querySelector(".saving"); if(el) el.textContent=saving; }

  root.addEventListener("click",function(e){
    var b=e.target.closest("button[data-act]"); if(!b) return;
    var a=b.dataset.act;
    if(a==="who"){
      me=b.dataset.name;
      try{ localStorage.setItem(NAME_KEY,me); }catch(x){}
      render(); load(); return;
    }
    if(a==="forget"){
      try{ localStorage.removeItem(NAME_KEY); localStorage.removeItem(VOTE_KEY); }catch(x){}
      me=null; render(); return;
    }
    if(a==="vote") vote(b.dataset.date, b.dataset.val==="1");
  });

  function startPolling(){
    clearInterval(poll);
    poll=setInterval(function(){ if(!document.hidden) load(); },15000);
  }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
  window.addEventListener("online",function(){ load(); });

  render();
  load();
  startPolling();
})();
</script>
</body>
</html>
